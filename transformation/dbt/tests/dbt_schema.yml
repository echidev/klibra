# dbt tests for Silver fact_economic_observation and Gold gold_macro_indicators.
# TDD §67 — minimum per production dataset: schema, uniqueness, nullability,
# type/domain validity, freshness, duplicate detection, referential integrity.

version: 2

models:
  - name: fact_economic_observation
    description: "Silver canonical observation fact (TDD §9, §11)."
    columns:
      - name: observation_id
        description: "Primary key (derived hash)."
        tests:
          - not_null
          - unique
      - name: metric_id
        tests:
          - not_null
      - name: entity_id
        tests:
          - not_null
      - name: geography_id
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: unit
        tests:
          - not_null
      - name: quality_status
        tests:
          - accepted_values:
              values: ['ACCEPTED', 'ACCEPTED_WARNING', 'QUARANTINED', 'REJECTED']
      - name: effective_to
        description: "SCD-2 end; NULL while current."
    tests:
      # Referential integrity: every row references a registered source
      - relationships:
          to: ref('dim_source')
          field: source_id
      - relationships:
          to: ref('dim_dataset')
          field: dataset_id
      # SCD-2 invariant: at most one current row per version key
      - dbt_utils.expression_is_true:
          expression: >
            count(*) over (
              partition by metric_id, entity_id, geography_id, coalesce(sector_id, ''),
                observation_date, source_id, dataset_id, coalesce(source_version, '')
            ) <= 1

  - name: gold_macro_indicators
    description: "Consumer-oriented curated macro product (TDD §10)."
    columns:
      - name: metric_id
        description: "Standardized metric id."
        tests:
          - not_null
      - name: entity_id
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: lineage_ref
        description: "Lineage back to the Silver fact."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - metric_id
            - entity_id
            - observation_date
